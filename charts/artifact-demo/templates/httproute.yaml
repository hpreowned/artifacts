{{- include "artifact-demo.validate" . -}}
# Exact hostname; Gateway API prefers it over the *.corp-artifacts.net wildcard in
# charts/artifacts-platform/templates/httproutes.yaml, same precedence charts/artifact-python relies on.
#
# apiVersion gateway.networking.k8s.io/v1: the same version every other HTTPRoute in this repo uses
# (charts/artifact-python/templates/httproute.yaml, charts/artifacts-platform/templates/httproutes.yaml) --
# checked here rather than assumed. HTTPRouteFilter type ResponseHeaderModifier is part of the Gateway API
# "Core" (not "Extended") support level since it was promoted out of Extended in the v0.8/v1.0 graduation,
# so it is valid at v1 with no extra CRD or implementation-specific annotation; Istio's Gateway API
# implementation (what this cluster runs ambient on, DESIGN §6.8) supports it. §6.13 asks for exactly this
# filter shape to inject the demo CSP and the expiry banner header.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "artifact-demo.fullname" . }}
  namespace: artifacts-dynamic
  labels:
    {{- include "artifact-demo.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ printf "%s.%s" .Values.artifactId .Values.domain.artifactDomain | quote }}
  rules:
    - backendRefs:
        - name: {{ include "artifact-demo.fullname" . }}
          port: {{ .Values.service.port }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Content-Security-Policy
                value: {{ include "artifact-demo.csp" . | quote }}
              - name: X-Demo-Expires
                value: {{ .Values.expiresAt | quote }}
