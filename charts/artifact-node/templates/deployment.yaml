{{- include "artifact-node.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artifact-node.fullname" . }}
  namespace: artifacts-dynamic
  labels:
    {{- include "artifact-node.labels" . | nindent 4 }}
  # Release-level expiry, readable by `helm get manifest prototype-<id> -n artifacts-dynamic` so
  # pipelines/artifact-gc.yml does not have to query pods or labels to find it (same pattern as
  # charts/artifact-python/templates/deployment.yaml, T72).
  annotations:
    artifacts.corp.com/expires-at: {{ include "artifact-node.expiresAtLabel" . | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      artifacts.corp.com/id: {{ .Values.artifactId | quote }}
  template:
    metadata:
      labels:
        artifacts.corp.com/id: {{ .Values.artifactId | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        agentpool: untrusted
      tolerations:
        - key: artifacts.corp.com/untrusted
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: {{ .Values.image | quote }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            # The app's own use, per DESIGN §6.13's "Prototype environment ... Expires <date>" banner contract --
            # the server can surface this itself (e.g. in its own API responses) in addition to the
            # X-Prototype-Expires response header the HTTPRoute injects for the browser/shell.
            - name: PROTOTYPE_EXPIRES_AT
              value: {{ .Values.expiresAt | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- range .Values.writablePaths }}
            - name: {{ include "artifact-node.volName" . }}
              mountPath: {{ . }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            periodSeconds: 30
      volumes:
        {{- range .Values.writablePaths }}
        - name: {{ include "artifact-node.volName" . }}
          emptyDir:
            sizeLimit: {{ $.Values.writablePathSizeLimit }}
        {{- end }}
