{{- include "artifact-python.validate" . -}}
# Exact hostname; Gateway API prefers it over the *.corp-artifacts.net wildcard in deploy/routes-static.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "artifact-python.fullname" . }}
  namespace: artifacts-dynamic
  labels:
    {{- include "artifact-python.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ printf "%s.%s" .Values.artifactId .Values.domain.artifactDomain | quote }}
  rules:
    - backendRefs:
        - name: {{ include "artifact-python.fullname" . }}
          port: {{ .Values.service.port }}
