{{- if .Values.secrets.create }}
{{- range list "pipelineToken" "internalSharedKey" "viewTokenKey" }}
{{- if not (index $.Values.secrets .) }}{{ fail (printf "secrets.%s is required when secrets.create is true" .) }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecret }}
  namespace: artifacts-dev
  labels:
    {{- include "allinone.labels" . | nindent 4 }}
type: Opaque
stringData:
  PIPELINE_TOKEN: {{ .Values.secrets.pipelineToken | quote }}
  INTERNAL_SHARED_KEY: {{ .Values.secrets.internalSharedKey | quote }}
  VIEW_TOKEN_KEY: {{ .Values.secrets.viewTokenKey | quote }}
{{- end }}
