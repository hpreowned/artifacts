# intake-api (agent-intake's code, DESIGN §3). Replaces deploy/platform/intake-api.yaml. No Kubernetes RBAC,
# no secrets in the manifest. Environment variable names were reconciled against intake-api/README.md and
# src/config.ts at M2 (T50); keep them in sync if that config module changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake-api
  namespace: artifacts-system
  labels:
    app.kubernetes.io/name: intake-api
spec:
  replicas: {{ .Values.replicaCount.intakeApi }}
  selector:
    matchLabels:
      app.kubernetes.io/name: intake-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intake-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: intake-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: intake-api
          image: {{ .Values.images.intakeApi | quote }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: BACKEND
              value: azure            # anything else selects the in-memory implementations (CLAUDE.md)
            - name: STORAGE_ACCOUNT_URL
              value: "https://{{ .Values.storage.accountName }}.blob.core.windows.net"
            - name: STORAGE_CONTAINER_INTAKE
              value: {{ .Values.storage.containers.intake | quote }}
            - name: STORAGE_CONTAINER_JOBS
              value: {{ .Values.storage.containers.jobs | quote }}
            - name: STORAGE_CONTAINER_SERVING
              value: {{ .Values.storage.containers.serving | quote }}
            - name: SERVICEBUS_FQDN
              value: {{ .Values.serviceBus.fqdn | quote }}
            - name: SCAN_QUEUE
              value: {{ .Values.serviceBus.scanQueue | quote }}   # must equal scanner-worker's SCAN_QUEUE: same queue, enqueuer and consumer
            - name: SHELL_ORIGIN       # live artifact URL is ${SHELL_ORIGIN}/view/${artifactId}
              value: "https://{{ .Values.domains.shell }}"
            - name: PUBLIC_BASE_URL    # what clients see through App Gateway + APIM; uploadUrl is built from it
              value: {{ .Values.domains.publicBase | quote }}
            - name: ENTRA_TENANT_ID    # T18: beginPublish/getPublishStatus verify the caller's Entra bearer themselves
              value: {{ .Values.tenantId | quote }}
            - name: ENTRA_AUDIENCE    # the artifacts-mcp app registration's client id (GUID), not its Application ID URI
              value: {{ .Values.entra.audience | quote }}
          envFrom:
            - secretRef:
                name: intake-api-secrets   # VIEW_TOKEN_KEY, PIPELINE_TOKEN, INTERNAL_SHARED_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: intake-api-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: intake-api
  namespace: artifacts-system
  labels:
    app.kubernetes.io/name: intake-api
spec:
  selector:
    app.kubernetes.io/name: intake-api
  ports:
    - name: http
      port: 8080
      targetPort: http
