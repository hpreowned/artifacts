# scanner-worker (agent-intake's code, DESIGN §3, §5). Replaces deploy/platform/scanner-worker.yaml. Queue
# consumer; no Service, no Kubernetes RBAC. Identity: read intake, write serving + jobs, receive on the
# queue, Queue-builds on one Azure DevOps pipeline (granted in Azure DevOps to this identity's service
# principal, integration item I8). No Key Vault access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner-worker
  namespace: artifacts-system
  labels:
    app.kubernetes.io/name: scanner-worker
spec:
  replicas: {{ .Values.replicaCount.scannerWorker }}
  selector:
    matchLabels:
      app.kubernetes.io/name: scanner-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scanner-worker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: scanner-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scanner-worker
          image: {{ .Values.images.scannerWorker | quote }}
          ports:
            - name: health
              containerPort: 8081
          env:
            - name: BACKEND
              value: azure
            - name: STORAGE_ACCOUNT_URL
              value: "https://{{ .Values.storage.accountName }}.blob.core.windows.net"
            - name: STORAGE_CONTAINER_INTAKE
              value: {{ .Values.storage.containers.intake | quote }}
            - name: STORAGE_CONTAINER_SERVING
              value: {{ .Values.storage.containers.serving | quote }}
            - name: STORAGE_CONTAINER_JOBS
              value: {{ .Values.storage.containers.jobs | quote }}
            - name: SERVICEBUS_FQDN
              value: {{ .Values.serviceBus.fqdn | quote }}
            - name: SCAN_QUEUE
              value: {{ .Values.serviceBus.scanQueue | quote }}   # must equal intake-api's SCAN_QUEUE (same queue)
            - name: SHELL_ORIGIN       # static tier's live url is ${SHELL_ORIGIN}/view/${artifactId}
              value: "https://{{ .Values.domains.shell }}"
            - name: GITLEAKS_BIN       # baked into the scanner image (scanner/README.md SEC stage); SEC-000 warns if absent
              value: {{ .Values.scanner.gitleaksBin | quote }}
            - name: DEFENDER_TIMEOUT_SECONDS   # DESIGN §9: timeout routes to failed/human review, never allow
              value: {{ .Values.scanner.defenderTimeoutSeconds | quote }}
            - name: PIPELINE_TIMEOUT_HOURS     # contracts/states.md: scanning -> failed with no /events callback (T13)
              value: {{ .Values.scanner.pipelineTimeoutHours | quote }}
            - name: HEALTH_PORT         # T17: GET /healthz on this port, matches the probes below
              value: {{ .Values.scanner.healthPort | quote }}
            - name: INTAKE_INTERNAL_URL     # status writes go through intake-api's internal routes
              value: http://intake-api.artifacts-system.svc:8080
            - name: ADO_ORG
              value: {{ .Values.ado.org | quote }}
            - name: ADO_PROJECT
              value: {{ .Values.ado.project | quote }}
            - name: ADO_PIPELINE_ID         # numeric id of pipelines/artifact-python-deploy.yml once created
              value: {{ .Values.ado.pipelineId | quote }}
            - name: RUNTIME_MANIFEST        # baked into the scanner image from python-runtime's CI output
              value: {{ .Values.scanner.runtimeManifestPath | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: health          # tiny health endpoint on HEALTH_PORT; the worker exposes no other API
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi   # a 25 MiB zip, unpacked, plus gitleaks scratch
