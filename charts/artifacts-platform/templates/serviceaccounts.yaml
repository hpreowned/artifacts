# ServiceAccounts with Azure Workload Identity (DESIGN §6.11). Replaces deploy/platform/serviceaccounts.yaml.
# Each client id is a user-assigned managed identity federated to
# "system:serviceaccount:<namespace>:<name>" on the cluster's OIDC issuer; their object ids are the
# *PrincipalId parameters of infra/bicep/main.bicep. None of these ServiceAccounts has any Kubernetes RBAC
# (D12) and every pod sets automountServiceAccountToken: false; the workload identity webhook injects its
# own projected token volume. The artifacts-static ServiceAccount lives in templates/static-gateway.yaml so
# that each template still applies to exactly one namespace, mirroring the raw file layout.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intake-api
  namespace: artifacts-system
  annotations:
    azure.workload.identity/client-id: {{ .Values.identities.intakeApi.clientId | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scanner-worker
  namespace: artifacts-system
  annotations:
    azure.workload.identity/client-id: {{ .Values.identities.scannerWorker.clientId | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer-shell
  namespace: artifacts-system
  annotations:
    azure.workload.identity/client-id: {{ .Values.identities.viewerShell.clientId | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tls-sync
  namespace: artifacts-system
  annotations:
    azure.workload.identity/client-id: {{ .Values.identities.tlsSync.clientId | quote }}
automountServiceAccountToken: false
