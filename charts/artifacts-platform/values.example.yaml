# Example values with an obviously fake shape filled in. Copy this to a real values file and replace every
# value with the real one (never commit the real file if it contains anything sensitive — it should not,
# since none of these are secrets, but tenant/subscription identifiers are still not for a public repo).
# Render it with: helm template artifacts-platform charts/artifacts-platform -f charts/artifacts-platform/values.example.yaml

tenantId: "00000000-0000-0000-0000-000000000000"
keyVaultName: "kv-artifacts-example"

domains:
  shell: artifacts.example.corp
  artifacts: artifacts-example.net
  intakeInternal: intake.artifacts.example.internal
  publicBase: https://mcp.example.corp/artifacts

entra:
  audience: "11111111-1111-1111-1111-111111111111"
  viewerShellClientId: "22222222-2222-2222-2222-222222222222"

images:
  intakeApi: "jfrog.example.corp/artifacts/intake-api:1234"
  scannerWorker: "jfrog.example.corp/artifacts/scanner:1234"
  staticGateway: "jfrog.example.corp/artifacts/static-gateway:1234"
  viewerShell: "jfrog.example.corp/artifacts/viewer-shell:1234"
  tlsSyncPause: "jfrog.example.corp/docker/pause:3.10"

identities:
  intakeApi:
    clientId: "33333333-3333-3333-3333-333333333333"
  scannerWorker:
    clientId: "44444444-4444-4444-4444-444444444444"
  viewerShell:
    clientId: "55555555-5555-5555-5555-555555555555"
  tlsSync:
    clientId: "66666666-6666-6666-6666-666666666666"
  staticGateway:
    clientId: "77777777-7777-7777-7777-777777777777"
  blobfuse:
    clientId: "88888888-8888-8888-8888-888888888888"

storage:
  accountName: "startifactsexample"
  resourceGroup: "rg-artifacts-example"
  containers:
    intake: intake
    jobs: jobs
    serving: serving

serviceBus:
  fqdn: "sb-artifacts-example.servicebus.windows.net"
  scanQueue: artifact-scan

ado:
  org: "example-corp"
  project: "artifacts-platform"
  pipelineId: "42"

scanner:
  gitleaksBin: /usr/local/bin/gitleaks
  defenderTimeoutSeconds: 60
  pipelineTimeoutHours: 24
  healthPort: 8081
  runtimeManifestPath: /etc/artifacts/runtime-manifest.python-1.json

staticGatewayBlob:
  pvCapacity: 100Gi

resourceQuota:
  pods: "50"
  requestsCpu: "25"
  requestsMemory: 25Gi
  limitsCpu: "25"
  limitsMemory: 25Gi
  configmaps: "60"
  services: "60"

replicaCount:
  intakeApi: 2
  scannerWorker: 2
  staticGateway: 2
  viewerShell: 2
  tlsSync: 1

gateway:
  internalLbSubnet: "snet-aks-ilb-example"

authzMeshRoot:
  enableRootPolicy: false
