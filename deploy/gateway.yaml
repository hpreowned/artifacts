# Internal Istio Gateway (DESIGN §6.8). Istio creates the Envoy Deployment and an internal Azure LB Service in
# artifacts-system; its pods carry label gateway.networking.k8s.io/gateway-name=artifacts-internal, which
# networkpolicy-dynamic.yaml selects. TLS Secrets come from Key Vault via platform/secretproviderclass.yaml.
#
# Listeners
#   shell    artifacts.corp.com        viewer-shell (HTTPRoute in platform/viewer-shell.yaml)
#   content  *.corp-artifacts.net      static-gateway (routes-static.yaml) and every python artifact
#                                      (<id>.corp-artifacts.net, rendered by python-artifact/render.sh;
#                                      Gateway API gives the exact hostname precedence over the wildcard)
#   intake   intake.artifacts.internal APIM's backend hop over the VNet (DESIGN §6.11). Plain HTTP on 8080
#                                      inside the VNet only; TLS on this hop is optional in v1. To add it,
#                                      import a cert as Key Vault certificate intake-artifacts-internal-tls,
#                                      add it to the tls-sync SecretProviderClass and switch this listener to
#                                      HTTPS/443 like the others.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: artifacts-internal
  namespace: artifacts-system
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      # service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "<ilb-subnet-name>"
  listeners:
    - name: shell
      hostname: artifacts.corp.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: artifacts-corp-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              artifacts.corp.com/routes: allowed
    - name: content
      hostname: "*.corp-artifacts.net"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-corp-artifacts-net-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              artifacts.corp.com/routes: allowed
    - name: intake
      hostname: intake.artifacts.internal
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
