# Default deny for artifact pods, DESIGN §6.7 verbatim. Enforced by Azure CNI powered by Cilium.
# Ingress: only the Istio Gateway pods in artifacts-system, port 8080. Egress: nothing. No DNS, no IMDS
# (169.254.169.254), no cluster services, no internet. The egress wall is this policy, not Istio: ambient has
# no client-side AuthorizationPolicy and artifacts-dynamic is not in the mesh anyway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: artifacts-dynamic
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: artifacts-system
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: artifacts-internal
      ports:
        - port: 8080
          protocol: TCP
  # no egress rules on purpose
