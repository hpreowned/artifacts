# scanner-worker (agent-intake's code, DESIGN §3, §5). Queue consumer; no Service, no Kubernetes RBAC.
# Identity: read intake, write serving + jobs, receive on the queue, Queue-builds on one Azure DevOps pipeline
# (granted in Azure DevOps to this identity's service principal, integration item I8). No Key Vault access.
# Environment variable names are this directory's expectation of scanner/README.md; reconcile at M2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner-worker
  namespace: artifacts-system
  labels:
    app.kubernetes.io/name: scanner-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: scanner-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scanner-worker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: scanner-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scanner-worker
          image: jfrog.corp.com/artifacts/scanner:<tag>
          env:
            - name: BACKEND
              value: azure
            - name: STORAGE_ACCOUNT
              value: "<storage-account>"
            - name: INTAKE_CONTAINER
              value: intake
            - name: SERVING_CONTAINER
              value: serving
            - name: JOBS_CONTAINER
              value: jobs
            - name: SERVICEBUS_NAMESPACE
              value: "<servicebus-namespace>.servicebus.windows.net"
            - name: SCAN_QUEUE
              value: artifact-scan
            - name: DEFENDER_WAIT_SECONDS   # DESIGN §9: timeout routes to human review, never allow
              value: "60"
            - name: INTAKE_INTERNAL_URL     # status writes go through intake-api's internal routes
              value: http://intake-api.artifacts-system.svc:8080
            - name: ADO_ORG_URL
              value: https://dev.azure.com/<ado-org>
            - name: ADO_PROJECT
              value: "<ado-project>"
            - name: ADO_PIPELINE_ID         # numeric id of pipelines/artifact-python-deploy.yml once created
              value: "<artifact-python-deploy-pipeline-id>"
            - name: RUNTIME_MANIFEST_PATH   # baked into the scanner image from python-runtime's CI output
              value: /etc/artifacts/runtime-manifest.python-1.json
            - name: WORK_DIR
              value: /tmp/work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081           # tiny health endpoint; the worker exposes no API
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi   # a 25 MiB zip, unpacked, plus gitleaks scratch
