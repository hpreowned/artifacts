# Secrets Store CSI driver (AKS add-on) + Azure Key Vault provider, workload identity auth.
# Every SecretProviderClass mirrors Key Vault objects into a Kubernetes Secret (secretObjects) the moment a pod
# mounts it; that is why tls-sync.yaml exists: something must mount the TLS class for the Gateway's Secrets to
# appear. Key Vault contents are created by people (infra/README.md step 4); nothing here is a secret value.
#
# <keyvault-name> and <tenant-id> are the Key Vault from infra/bicep and the Entra tenant.
#
# `shell-session-key` signs the viewer-shell session cookie and OAuth state (viewer-shell/README.md); it is a real
# secret and lives in Key Vault like the others (infra/README.md step 4).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: intake-api-secrets
  namespace: artifacts-system
spec:
  provider: azure
  secretObjects:
    - secretName: intake-api-secrets
      type: Opaque
      data:
        - objectName: view-token-key
          key: VIEW_TOKEN_KEY
        - objectName: pipeline-token
          key: PIPELINE_TOKEN
        - objectName: internal-shared-key
          key: INTERNAL_SHARED_KEY
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<intake-api-identity-client-id>"
    keyvaultName: "<keyvault-name>"
    tenantId: "<tenant-id>"
    objects: |
      array:
        - |
          objectName: view-token-key
          objectType: secret
        - |
          objectName: pipeline-token
          objectType: secret
        - |
          objectName: internal-shared-key
          objectType: secret
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: viewer-shell-secrets
  namespace: artifacts-system
spec:
  provider: azure
  secretObjects:
    - secretName: viewer-shell-secrets
      type: Opaque
      data:
        - objectName: internal-shared-key
          key: INTERNAL_SHARED_KEY
        - objectName: entra-shell-client-secret
          key: ENTRA_CLIENT_SECRET
        - objectName: shell-session-key
          key: SHELL_SESSION_KEY
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<viewer-shell-identity-client-id>"
    keyvaultName: "<keyvault-name>"
    tenantId: "<tenant-id>"
    objects: |
      array:
        - |
          objectName: internal-shared-key
          objectType: secret
        - |
          objectName: entra-shell-client-secret
          objectType: secret
        - |
          objectName: shell-session-key
          objectType: secret
---
# The two Gateway certificates as kubernetes.io/tls Secrets. objectType "secret" on a Key Vault certificate
# returns the PEM bundle (key + chain); the provider splits it into tls.key and tls.crt by objectName.
# Secret names match gateway.yaml certificateRefs exactly.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gateway-tls
  namespace: artifacts-system
spec:
  provider: azure
  secretObjects:
    - secretName: artifacts-corp-com-tls
      type: kubernetes.io/tls
      data:
        - objectName: artifacts-corp-com-tls
          key: tls.key
        - objectName: artifacts-corp-com-tls
          key: tls.crt
    - secretName: wildcard-corp-artifacts-net-tls
      type: kubernetes.io/tls
      data:
        - objectName: wildcard-corp-artifacts-net-tls
          key: tls.key
        - objectName: wildcard-corp-artifacts-net-tls
          key: tls.crt
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<tls-sync-identity-client-id>"
    keyvaultName: "<keyvault-name>"
    tenantId: "<tenant-id>"
    objects: |
      array:
        - |
          objectName: artifacts-corp-com-tls
          objectType: secret
        - |
          objectName: wildcard-corp-artifacts-net-tls
          objectType: secret
