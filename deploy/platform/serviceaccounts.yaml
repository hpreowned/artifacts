# ServiceAccounts with Azure Workload Identity (DESIGN §6.11). Each client id is a user-assigned managed
# identity federated to "system:serviceaccount:<namespace>:<name>" on the cluster's OIDC issuer; their object
# ids are the *PrincipalId parameters of infra/bicep/main.bicep. None of these ServiceAccounts has any
# Kubernetes RBAC (D12) and every pod sets automountServiceAccountToken: false; the workload identity webhook
# injects its own projected token volume. The artifacts-static ServiceAccount lives in static-gateway.yaml
# so that each file applies to exactly one namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intake-api
  namespace: artifacts-system
  annotations:
    azure.workload.identity/client-id: "<intake-api-identity-client-id>"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scanner-worker
  namespace: artifacts-system
  annotations:
    azure.workload.identity/client-id: "<scanner-worker-identity-client-id>"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer-shell
  namespace: artifacts-system
  annotations:
    azure.workload.identity/client-id: "<viewer-shell-identity-client-id>"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tls-sync
  namespace: artifacts-system
  annotations:
    azure.workload.identity/client-id: "<tls-sync-identity-client-id>"
automountServiceAccountToken: false
