# Python artifact template, DESIGN §6.6 verbatim plus the ConfigMap, Service and HTTPRoute.
# Rendered by render.sh; placeholders: __ID__, __EXPIRES_AT__ (label form, ':' -> '-'), __IMAGE__ (digest-pinned),
# __ARGS__ (JSON array from the runtime manifest), __APP_PY__ (replaced by app.py indented by 4 spaces).
# Anything that drifts from this shape is denied by Azure Policy and PSA restricted (deploy/policy/).
apiVersion: v1
kind: ConfigMap
metadata:
  name: art-__ID__-code
  namespace: artifacts-dynamic
  labels:
    artifacts.corp.com/id: "__ID__"
    artifacts.corp.com/expires-at: "__EXPIRES_AT__"
data:
  app.py: |2
__APP_PY__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: art-__ID__
  namespace: artifacts-dynamic
  labels:
    artifacts.corp.com/id: "__ID__"
    artifacts.corp.com/expires-at: "__EXPIRES_AT__"
spec:
  replicas: 1
  selector:
    matchLabels:
      artifacts.corp.com/id: "__ID__"
  template:
    metadata:
      labels:
        artifacts.corp.com/id: "__ID__"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        agentpool: untrusted
      tolerations:
        - key: artifacts.corp.com/untrusted
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: __IMAGE__
          args: __ARGS__
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 256Mi
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
      volumes:
        - name: code
          configMap:
            name: art-__ID__-code
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: art-__ID__
  namespace: artifacts-dynamic
  labels:
    artifacts.corp.com/id: "__ID__"
    artifacts.corp.com/expires-at: "__EXPIRES_AT__"
spec:
  selector:
    artifacts.corp.com/id: "__ID__"
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Exact hostname; Gateway API prefers it over the *.corp-artifacts.net wildcard in deploy/routes-static.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: art-__ID__
  namespace: artifacts-dynamic
  labels:
    artifacts.corp.com/id: "__ID__"
    artifacts.corp.com/expires-at: "__EXPIRES_AT__"
spec:
  parentRefs:
    - name: artifacts-internal
      namespace: artifacts-system
      sectionName: content
  hostnames:
    - __ID__.corp-artifacts.net
  rules:
    - backendRefs:
        - name: art-__ID__
          port: 8080
