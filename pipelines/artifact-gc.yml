# Nightly garbage collection, DESIGN §6.12 last paragraph, D12, D13.
#   1. Find every Helm release in artifacts-dynamic whose expiry has passed and `helm uninstall` it.
#   2. Delete serving/<id>/ for every expired static artifact listed by intake-api's job records
#      (jobs/<jobId>.json with artifactId, tier, state, expiresAt) and post `expired` for each.
# Same pool, AKS service connection and INTAKE_EVENTS_URL convention as artifact-python-deploy.yml: the
# variable is the bare intake base URL, every callback posts to <url>/v1/publish/<jobId>/events (the
# contracts/intake-openapi.yaml path). Variable group artifacts-platform.
#
# T72 (M7, D13) — gc_dynamic replaced by `helm list` + `helm uninstall`, raw kubectl delete-by-label gone
# -----------------------------------------------------------------------------------------------------------
# Was: `kubectl get deploy -l artifacts.corp.com/expires-at` read the expiry off the Deployment's own label,
# then `kubectl delete` the four object kinds by `artifacts.corp.com/id` label. Now each artifact is a Helm
# release (charts/artifact-python, release name art-<id>), so GC lists releases and removes a whole release
# at once with `helm uninstall` instead of deleting four kinds by hand.
#
# Mechanism chosen for reading expiry: `helm get manifest <release> -n artifacts-dynamic`, not
# `helm get metadata`. `helm get metadata` only surfaces chart-level fields (name/version/appVersion/
# chart/namespace) — nothing from a specific release's values — so it cannot carry a per-artifact expiry.
# `charts/artifact-python/templates/deployment.yaml` sets `metadata.annotations["artifacts.corp.com/
# expires-at"]` on the Deployment specifically so `helm get manifest` (which renders the release's stored
# manifest, not a live cluster read) exposes it without a `kubectl get` / pod query at all.
schedules:
  - cron: "0 3 * * *"
    displayName: Nightly artifact GC
    branches:
      include: [main]
    always: true

trigger: none
pr: none

pool:
  name: <your-vnet-pool>

variables:
  - group: artifacts-platform

jobs:
  - job: gc_dynamic
    displayName: Expire Python artifact Helm releases in artifacts-dynamic
    steps:
      - checkout: none
      - task: Kubernetes@1
        displayName: kubectl login (helm reads this kubeconfig too)
        inputs:
          connectionType: Kubernetes Service Connection
          kubernetesServiceEndpoint: <aks-connection>
          namespace: artifacts-dynamic
          command: login
      - script: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          echo "now=$now"
          : > expired-releases.txt
          helm list -n artifacts-dynamic -o json | jq -r '.[] | select(.name | startswith("art-")) | .name' \
          | while IFS= read -r release; do
              [ -n "$release" ] || continue
              expires="$(helm get manifest "$release" -n artifacts-dynamic \
                | python3 -c 'import sys, yaml; docs = [d for d in yaml.safe_load_all(sys.stdin) if d and d.get("kind") == "Deployment"]; print(docs[0]["metadata"].get("annotations", {}).get("artifacts.corp.com/expires-at", "") if docs else "")')"
              echo "release=$release expires=$expires"
              if [ -n "$expires" ] && [ "$expires" \< "$now" ]; then
                echo "$release" >> expired-releases.txt
              fi
            done
          echo "expired: $(wc -l < expired-releases.txt)"
        displayName: List releases, read expiry from helm get manifest
      - script: |
          set -euo pipefail
          while IFS= read -r release; do
            [ -n "$release" ] || continue
            echo "helm uninstall $release"
            helm uninstall "$release" -n artifacts-dynamic
          done < expired-releases.txt
        displayName: helm uninstall expired releases
      - task: Kubernetes@1
        displayName: kubectl logout
        condition: always()
        inputs:
          connectionType: Kubernetes Service Connection
          kubernetesServiceEndpoint: <aks-connection>
          command: logout

  - job: gc_static
    displayName: Expire static artifacts in Blob
    steps:
      - task: AzureCLI@2
        displayName: Delete expired serving/<id>/ prefixes
        inputs:
          azureSubscription: <storage-connection>
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            acct="$(STORAGE_ACCOUNT)"
            now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            az storage blob list --auth-mode login --account-name "$acct" -c jobs --num-results '*' --query '[].name' -o tsv > jobs.txt
            echo "job records: $(wc -l < jobs.txt)"
            : > expired.tsv
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              az storage blob download --auth-mode login --account-name "$acct" -c jobs -n "$name" -f job.json --no-progress >/dev/null
              jq -r --arg now "$now" --arg job "$name" \
                'select(.state=="live" and .expiresAt < $now) | [($job | sub("\\.json$"; "")), .tier, .artifactId] | @tsv' job.json >> expired.tsv || true
            done < jobs.txt
            echo "expired live artifacts: $(wc -l < expired.tsv)"
            while IFS=$'\t' read -r jobId tier artifactId; do
              [ -n "$artifactId" ] || continue
              if [ "$tier" = static ]; then
                echo "deleting serving/$artifactId/"
                az storage blob delete-batch --auth-mode login --account-name "$acct" --source serving --pattern "$artifactId/*"
              fi
              curl -fsS -X POST "$(INTAKE_EVENTS_URL)/v1/publish/$jobId/events" \
                -H "Authorization: Bearer ${PIPELINE_TOKEN}" -H "Content-Type: application/json" \
                -d '{"state":"expired","message":"removed by artifact-gc"}' || echo "callback failed for $jobId"
            done < expired.tsv
        env:
          PIPELINE_TOKEN: $(PIPELINE_TOKEN)
