# Deploys one approved Python artifact, DESIGN §6.12, D10, D12.
# Triggered by the scanner worker: POST .../_apis/pipelines/<id>/runs?api-version=7.1 with
# templateParameters { jobId } — that is all `scanner/src/pipeline.ts` sends. Everything else (artifactId,
# expiresAt, entrypoint style) is read from the job record `jobs/<jobId>.json` in the Fetch stage below.
# The job record (intake-api/src/job.ts JobRecord) carries no field for "streamlit vs fastapi": its
# `manifest.entrypoint` is only the file name ("app.py"), never the framework. So entrypoint style is derived
# by parsing app.py's imports with python3's stdlib `ast` module (same technique as scanner/imports.py) —
# streamlit if it imports streamlit, else fastapi. If a future contract change adds an explicit field to the
# job record, prefer it over this derivation.
# Human approval is the check on Environment artifacts-dynamic (group artifacts-approvers, 7 days), not YAML.
#
# Variable group artifacts-platform (Key Vault-linked for the secret):
#   PIPELINE_TOKEN        secret, Key Vault secret pipeline-token
#   INTAKE_EVENTS_URL     http://intake.artifacts.internal:8080   (base only; every callback below posts to
#                         <url>/v1/publish/<jobId>/events, the exact contracts/intake-openapi.yaml path)
#   STORAGE_ACCOUNT       <storage-account>
#   PYTHON_RUNTIME_IMAGE  jfrog.corp.com/artifacts/python-runtime@sha256:<digest>
#
# -----------------------------------------------------------------------------------------------------------
# T72 (M7, D13) — Deploy stage replaced by `helm upgrade --install`, raw render.sh/KubernetesManifest@1 gone
# -----------------------------------------------------------------------------------------------------------
# Was: `render.sh` filled deploy/python-artifact/template.yaml, then `KubernetesManifest@1` applied the
# result. Now: `charts/artifact-python` (checked out with `checkout: self`, kept below) renders the same
# ConfigMap/Deployment/Service/HTTPRoute from values, and `helm upgrade --install art-<artifactId> ...` both
# renders and applies in one step, giving us `--wait`/`--timeout` for the rollout check that
# `KubernetesManifest@1`'s `rolloutStatusTimeout` used to provide.
#
# Task choice: a plain `script` step running the `helm` CLI, authenticated against the cluster via
# `Kubernetes@1` (`command: login`) immediately before it, rather than `HelmDeploy@1`. Reasons:
#   - `HelmDeploy@1` wraps a fixed set of helm subcommands (install/upgrade/package/...) behind task inputs;
#     `--set-file appPy=...` (a file-valued --set, not a values file) and reading PYTHON_RUNTIME_IMAGE from
#     a variable group are awkward to express through its input schema, whereas the CLI gets both for free.
#   - `Kubernetes@1 login` writes a kubeconfig from the `kubernetesServiceConnection` into
#     `KUBECONFIG`/`$(Agent.TempDirectory)` and does nothing else; it is the same primitive
#     `KubernetesManifest@1` used internally, so the AKS service connection, RBAC and audit trail are
#     unchanged from before this task. `helm` on the self-hosted pool picks up that kubeconfig the same way
#     `kubectl` would.
#   - Keeps this stage's failure/report step shape (one `script` per concern, `name:` + guarded report step)
#     identical to every other step in this file instead of inventing a parallel pattern for one task.
# `helm uninstall` equivalent in pipelines/artifact-gc.yml uses the same `Kubernetes@1` login for consistency.
#
# -----------------------------------------------------------------------------------------------------------
# T51 — step-scoped failure reporting (2026-10-14, agent-pipeline)
# -----------------------------------------------------------------------------------------------------------
# Was: the Report stage's verdict step used `condition: failed()`, which is job-wide — it fired on ANY
# failure in the Fetch job (job-record download, bundle download, or gitleaks) and Report then hard-coded
# "gitleaks found a secret" whenever it had fired. A fetch/download failure was reported to intake as a
# gitleaks rejection.
#
# Now: every step that can fail has a `name:`, and is immediately followed by a guarded report step —
# `condition: and(failed(), eq(variables['reported'], ''))` — that posts the real EventIn itself, inline,
# in the same job, and sets `reported` so only the first real failure is ever reported (later guarded
# steps see `reported` already set to '1' and skip, even though `failed()` stays true for the rest of the
# job). Fetch and Deploy each report their own failures this way; nothing is threaded across stages. The
# Report stage shrinks to the one case neither job can ever see for itself: the approval check deciding
# the Deploy job never starts at all.
#
# Failure -> callback mapping (contracts/states.md):
#   Fetch / jobrecord step fails         -> failed,    "fetch failed: job record download"
#   Fetch / download (bundle) step fails -> failed,    "fetch failed: bundle download"
#   Fetch / gitleaks step fails          -> rejected,  "gitleaks found a secret in the bundle (see the
#                                                        gitleaks-report artifact on this run)"; that
#                                                        artifact is published only on this path
#   Fetch / any other step fails         -> failed,    "fetch failed: unspecified step (see run log)"
#                                                        (catch-all: checkout, entrypoint derivation,
#                                                        bundle publish, the awaiting_approval callback)
#   Fetch / Sonar prepare or analyze     -> no callback; `continueOnError: true` keeps Agent.JobStatus out
#                                                        of Failed, so Sonar can never trip any of the
#                                                        above (contract: Sonar is advisory, never changes
#                                                        the job's state)
#   Deploy / download bundle artifact    -> failed,    "deploy failed: download published bundle"
#   Deploy / callback-deploying step     -> failed,    "deploy failed: callback deploying"
#   Deploy / kubectl login (AKS conn)    -> failed,    "deploy failed: kubectl login"
#   Deploy / helm upgrade --install      -> failed,    "deploy failed: helm upgrade"
#   Deploy / callback-live step fails    -> failed,    "deploy failed: callback to intake after a
#                                                        successful rollout; the app may already be live,
#                                                        verify by hand" (rollout itself already succeeded)
#   Deploy / any other step fails        -> failed,    "deploy failed: unspecified step (see run log)"
#   Deploy stage never started (Fetch    -> rejected or expired, from the Approvals REST API — see T52
#     succeeded, Deploy stage == Skipped)              below; falls back to the old "can't tell them apart"
#                                                        message only if the API call itself fails
#
# Research (do not guess the syntax; cited per instructions):
#   - Job status check functions (failed(), succeeded(), succeededOrFailed(), always()), the `dependencies`
#     / `stageDependencies` contexts and output-variable addressing, and `coalesce()`:
#     https://learn.microsoft.com/en-us/azure/devops/pipelines/process/expressions
#   - Step-level vs job-level default conditions, custom conditions, and in particular "Step variables used
#     in subsequent step conditions" — a plain (non-`isOutput`) `##vso[task.setvariable ...]` set by one
#     step is readable via `variables['x']` in a later step's own `condition:` in the same job, which is the
#     exact mechanism the `reported` guard below relies on — plus stage-to-stage `dependencies.<stage>.result`:
#     https://learn.microsoft.com/en-us/azure/devops/pipelines/process/conditions
#   - Environment approval checks, to find out what a declined vs. a timed-out check does to the stage:
#     https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals
#
# -----------------------------------------------------------------------------------------------------------
# T52 — Report stage distinguishes a declined approval from a timed-out one via the Approvals REST API
# -----------------------------------------------------------------------------------------------------------
# Was: `dependencies.Deploy.result == 'Skipped'` cannot distinguish a decline from a timeout in YAML (both
# leave the Deploy stage Skipped; the deployment job's own steps never run in either case), so the Report
# stage always posted `rejected` with a message pointing at the Checks tab.
#
# Now: the Report job queries the Approvals REST API directly for *this run's* approval and reads its real
# `status` (which the API does distinguish — see below) before posting.
#
# Research (do not guess the syntax; cited per instructions):
#   - Approvals - Query: `GET https://dev.azure.com/{org}/{project}/_apis/pipelines/approvals?api-version=7.1`
#     (optionally filtered by `approvalIds`, `state`, `userIds`). `ApprovalStatus` is an enum that DOES carry
#     both outcomes we need to distinguish, among others: pending, approved, rejected, skipped, canceled,
#     timedOut, failed, completed. `Approval.steps[]` carries `assignedApprover`/`actualApprover` (who) and
#     `lastModifiedOn` (when):
#     https://learn.microsoft.com/en-us/rest/api/azure/devops/approvalsandchecks/approvals/query?view=azure-devops-rest-7.1
#   - Approvals - Get (fetch one approval by id once we have it):
#     `GET https://dev.azure.com/{org}/{project}/_apis/pipelines/approvals/{approvalId}?api-version=7.1`
#     https://learn.microsoft.com/en-us/rest/api/azure/devops/approvalsandchecks/approvals/get?view=azure-devops-rest-7.1
#   - The Query endpoint takes approval ids, not a run id, so the approval for *this* run has to be found via
#     the run's own timeline: Timeline - Get, `GET
#     https://dev.azure.com/{org}/{project}/_apis/build/builds/{buildId}/timeline?api-version=7.1` (Pipelines
#     runs are Build objects under the hood; `$(Build.BuildId)` is this run's buildId):
#     https://learn.microsoft.com/en-us/rest/api/azure/devops/build/timeline/get?view=azure-devops-rest-7.1
#     The timeline's flat `records[]` list nests three levels for an environment-check approval: a `Stage`
#     record for the Deploy stage, a child `Checkpoint` record (`parentId` == the Stage record's `id`), and a
#     child `Checkpoint.Approval` record (`parentId` == the Checkpoint record's `id`) whose own `id` IS the
#     approval id the Approvals API takes. (Confirmed against a worked curl/jq walkthrough that uses exactly
#     this three-hop traversal and the same two Approvals endpoints above; Microsoft's own docs for the
#     `Checkpoint`/`Checkpoint.Approval` record *types* are not published, only inferable from the timeline
#     response shape, which is why this is flagged UNVERIFIED against a live run in the final report.)
#
# Permissions: the job needs `env: SYSTEM_ACCESSTOKEN: $(System.AccessToken)` (set below) plus "Allow scripts
# to access the OAuth token" enabled for this pipeline/job, which grants the `vso.build` scope the Timeline
# API needs. The build identity — the project's "{Project} Build Service ({Organization})" account that
# already runs this pipeline — additionally needs read access to the environment's checks: grant it the
# "Reader" role on the `artifacts-dynamic` Environment's security pane (Project Settings > Environments >
# artifacts-dynamic > Security), which is what the Approvals Query/Get endpoints authorize against. This is
# a project-level permission grant, not expressible in this YAML.
#
# What this cannot do: if the timeline walk itself fails (no Checkpoint.Approval record found — e.g. the
# check was removed, or the environment has no approval check configured at all) the script falls back to
# the old "can't tell them apart" message rather than guessing, so a pipeline change elsewhere can never
# make this stage silently post a wrong state.
parameters:
  - name: jobId
    type: string
  # D16: the scanner decides who approves. `human` targets the environment with the approval check and posts
  # awaiting_approval first; `auto` targets the environment without checks and goes straight to deploying.
  - name: approvalMode
    type: string
    default: human
    values: [auto, human]

trigger: none
pr: none

pool:
  name: <your-vnet-pool>

variables:
  - group: artifacts-platform
  - name: runUrl
    value: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)

stages:
  - stage: Fetch
    displayName: Fetch job record, bundle and scan
    jobs:
      - job: fetch
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Download job record (jobs/<jobId>.json)
            name: jobrecord
            inputs:
              azureSubscription: <storage-connection>
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az storage blob download --auth-mode login --account-name "$(STORAGE_ACCOUNT)" \
                  -c jobs -n "${{ parameters.jobId }}.json" -f job.json
                artifactId="$(jq -r '.artifactId' job.json)"
                # Reformat the job record's expiresAt (Date.toISOString(), fractional seconds) to the
                # RFC 3339 whole-second form render.sh and template.yaml's expires-at label require.
                expiresAt="$(date -u -d "$(jq -r '.expiresAt' job.json)" +%Y-%m-%dT%H:%M:%SZ)"
                echo "artifactId=$artifactId expiresAt=$expiresAt"
                echo "##vso[task.setvariable variable=artifactId;isOutput=true]$artifactId"
                echo "##vso[task.setvariable variable=expiresAt;isOutput=true]$expiresAt"

          - script: |
              echo "##vso[task.setvariable variable=reported]1"
              curl -fsS -X POST "$(INTAKE_EVENTS_URL)/v1/publish/${{ parameters.jobId }}/events" \
                -H "Authorization: Bearer ${PIPELINE_TOKEN}" -H "Content-Type: application/json" \
                -d "{\"state\":\"failed\",\"runUrl\":\"$(runUrl)\",\"message\":\"fetch failed: job record download\"}"
            displayName: "Report: job record download failed"
            name: jobrecordFailed
            condition: and(failed(), eq(variables['reported'], ''))
            env:
              PIPELINE_TOKEN: $(PIPELINE_TOKEN)

          - task: AzureCLI@2
            displayName: Download bundle from intake
            name: download
            inputs:
              azureSubscription: <storage-connection>
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az storage blob download --auth-mode login --account-name "$(STORAGE_ACCOUNT)" \
                  -c intake -n "${{ parameters.jobId }}.zip" -f bundle.zip
                mkdir -p bundle && unzip -q bundle.zip -d bundle
                test -f bundle/app.py && test -f bundle/manifest.json
                ls -la bundle

          - script: |
              echo "##vso[task.setvariable variable=reported]1"
              curl -fsS -X POST "$(INTAKE_EVENTS_URL)/v1/publish/${{ parameters.jobId }}/events" \
                -H "Authorization: Bearer ${PIPELINE_TOKEN}" -H "Content-Type: application/json" \
                -d "{\"state\":\"failed\",\"runUrl\":\"$(runUrl)\",\"message\":\"fetch failed: bundle download\"}"
            displayName: "Report: bundle download failed"
            name: downloadFailed
            condition: and(failed(), eq(variables['reported'], ''))
            env:
              PIPELINE_TOKEN: $(PIPELINE_TOKEN)

          - script: |
              set -euo pipefail
              gitleaks detect --source bundle --no-git --exit-code 1 \
                --config "$(Build.SourcesDirectory)/.gitleaks.toml" \
                --report-format sarif --report-path "$(Build.ArtifactStagingDirectory)/gitleaks.sarif"
            displayName: gitleaks (deny on finding)
            name: gitleaks

          - script: |
              echo "##vso[task.setvariable variable=reported]1"
              echo "##vso[task.setvariable variable=gitleaksFailed]1"
              curl -fsS -X POST "$(INTAKE_EVENTS_URL)/v1/publish/${{ parameters.jobId }}/events" \
                -H "Authorization: Bearer ${PIPELINE_TOKEN}" -H "Content-Type: application/json" \
                -d "{\"state\":\"rejected\",\"runUrl\":\"$(runUrl)\",\"message\":\"gitleaks found a secret in the bundle (see the gitleaks-report artifact on this run)\"}"
            displayName: "Report: gitleaks found a secret"
            name: gitleaksFailed
            condition: and(failed(), eq(variables['reported'], ''))
            env:
              PIPELINE_TOKEN: $(PIPELINE_TOKEN)

          - publish: $(Build.ArtifactStagingDirectory)/gitleaks.sarif
            artifact: gitleaks-report
            displayName: Publish gitleaks report (only when gitleaks rejected the bundle)
            name: publishGitleaksReport
            condition: eq(variables['gitleaksFailed'], '1')
            continueOnError: true

          - script: |
              set -euo pipefail
              entry="$(python3 -c "
              import ast
              tree = ast.parse(open('bundle/app.py', encoding='utf-8').read())
              names = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names.update(n.name.split('.')[0] for n in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      names.add(node.module.split('.')[0])
              print('streamlit' if 'streamlit' in names else 'fastapi')
              ")"
              echo "entrypoint=$entry"
              echo "##vso[task.setvariable variable=entrypoint;isOutput=true]$entry"
            displayName: Derive entrypoint style from app.py imports
            name: entrypoint

          - task: SonarQubePrepare@7
            displayName: Sonar prepare (advisory)
            name: sonarPrepare
            continueOnError: true
            inputs:
              SonarQube: <sonar-connection>
              scannerMode: cli
              configMode: manual
              cliProjectKey: artifacts-python
              cliProjectName: Published Python artifacts
              cliSources: bundle
              extraProperties: |
                sonar.projectVersion=${{ parameters.jobId }}
                sonar.python.version=3.12

          - task: SonarQubeAnalyze@7
            displayName: Sonar analyze (advisory, no quality gate)
            name: sonarAnalyze
            continueOnError: true

          - publish: bundle
            artifact: bundle
            displayName: Publish bundle
            name: publishBundle

          - script: |
              set -euo pipefail
              curl -fsS -X POST "$(INTAKE_EVENTS_URL)/v1/publish/${{ parameters.jobId }}/events" \
                -H "Authorization: Bearer ${PIPELINE_TOKEN}" -H "Content-Type: application/json" \
                -d "{\"state\":\"awaiting_approval\",\"runUrl\":\"$(runUrl)\",\"message\":\"gitleaks clean; Sonar report on the run; waiting for artifacts-approvers\"}"
            displayName: Callback awaiting_approval
            name: callbackAwaitingApproval
            condition: and(succeeded(), eq('${{ parameters.approvalMode }}', 'human'))
            env:
              PIPELINE_TOKEN: $(PIPELINE_TOKEN)

          - script: |
              curl -fsS -X POST "$(INTAKE_EVENTS_URL)/v1/publish/${{ parameters.jobId }}/events" \
                -H "Authorization: Bearer ${PIPELINE_TOKEN}" -H "Content-Type: application/json" \
                -d "{\"state\":\"failed\",\"runUrl\":\"$(runUrl)\",\"message\":\"fetch failed: unspecified step (see run log)\"}"
            displayName: "Report: unspecified fetch failure (catch-all)"
            name: fetchCatchAll
            condition: and(failed(), eq(variables['reported'], ''))
            env:
              PIPELINE_TOKEN: $(PIPELINE_TOKEN)

  - stage: Deploy
    dependsOn: Fetch
    condition: succeeded()
    jobs:
      - deployment: deploy
        ${{ if eq(parameters.approvalMode, 'auto') }}:
          environment: artifacts-dynamic-auto
        ${{ else }}:
          environment: artifacts-dynamic
        variables:
          artifactId: $[ stageDependencies.Fetch.fetch.outputs['jobrecord.artifactId'] ]
          expiresAt: $[ stageDependencies.Fetch.fetch.outputs['jobrecord.expiresAt'] ]
          entrypoint: $[ stageDependencies.Fetch.fetch.outputs['entrypoint.entrypoint'] ]
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self        # deployment jobs do not check out the repo by default; charts/ lives in it
                - download: current
                  artifact: bundle
                  name: downloadArtifact

                - script: |
                    echo "##vso[task.setvariable variable=reported]1"
                    curl -fsS -X POST "$(INTAKE_EVENTS_URL)/v1/publish/${{ parameters.jobId }}/events" \
                      -H "Authorization: Bearer ${PIPELINE_TOKEN}" -H "Content-Type: application/json" \
                      -d "{\"state\":\"failed\",\"runUrl\":\"$(runUrl)\",\"message\":\"deploy failed: download published bundle\"}"
                  displayName: "Report: bundle artifact download failed"
                  name: downloadArtifactFailed
                  condition: and(failed(), eq(variables['reported'], ''))
                  env:
                    PIPELINE_TOKEN: $(PIPELINE_TOKEN)

                - script: |
                    set -euo pipefail
                    curl -fsS -X POST "$(INTAKE_EVENTS_URL)/v1/publish/${{ parameters.jobId }}/events" \
                      -H "Authorization: Bearer ${PIPELINE_TOKEN}" -H "Content-Type: application/json" \
                      -d "{\"state\":\"deploying\",\"runUrl\":\"$(runUrl)\"}"
                  displayName: Callback deploying
                  name: callbackDeploying
                  env:
                    PIPELINE_TOKEN: $(PIPELINE_TOKEN)

                - script: |
                    echo "##vso[task.setvariable variable=reported]1"
                    curl -fsS -X POST "$(INTAKE_EVENTS_URL)/v1/publish/${{ parameters.jobId }}/events" \
                      -H "Authorization: Bearer ${PIPELINE_TOKEN}" -H "Content-Type: application/json" \
                      -d "{\"state\":\"failed\",\"runUrl\":\"$(runUrl)\",\"message\":\"deploy failed: callback deploying\"}"
                  displayName: "Report: callback-deploying failed"
                  name: callbackDeployingFailed
                  condition: and(failed(), eq(variables['reported'], ''))
                  env:
                    PIPELINE_TOKEN: $(PIPELINE_TOKEN)

                - task: Kubernetes@1
                  displayName: kubectl login (AKS service connection; also used by helm below)
                  name: kubectlLogin
                  inputs:
                    connectionType: Kubernetes Service Connection
                    kubernetesServiceEndpoint: <aks-connection>
                    namespace: artifacts-dynamic
                    command: login

                - script: |
                    echo "##vso[task.setvariable variable=reported]1"
                    curl -fsS -X POST "$(INTAKE_EVENTS_URL)/v1/publish/${{ parameters.jobId }}/events" \
                      -H "Authorization: Bearer ${PIPELINE_TOKEN}" -H "Content-Type: application/json" \
                      -d "{\"state\":\"failed\",\"runUrl\":\"$(runUrl)\",\"message\":\"deploy failed: kubectl login\"}"
                  displayName: "Report: kubectl login failed"
                  name: kubectlLoginFailed
                  condition: and(failed(), eq(variables['reported'], ''))
                  env:
                    PIPELINE_TOKEN: $(PIPELINE_TOKEN)

                - script: |
                    set -euo pipefail
                    bundle="$(Pipeline.Workspace)/bundle"
                    echo "artifact=$(artifactId) entrypoint=$(entrypoint) expires=$(expiresAt) image=$(PYTHON_RUNTIME_IMAGE)"
                    helm upgrade --install "art-$(artifactId)" "$(Build.SourcesDirectory)/charts/artifact-python" \
                      --namespace artifacts-dynamic \
                      --set artifactId="$(artifactId)" \
                      --set-file appPy="$bundle/app.py" \
                      --set expiresAt="$(expiresAt)" \
                      --set entrypoint="$(entrypoint)" \
                      --set image="$(PYTHON_RUNTIME_IMAGE)" \
                      --set jobId="${{ parameters.jobId }}" \
                      --wait --timeout 3m
                  displayName: helm upgrade --install
                  name: helmUpgrade

                - script: |
                    echo "##vso[task.setvariable variable=reported]1"
                    curl -fsS -X POST "$(INTAKE_EVENTS_URL)/v1/publish/${{ parameters.jobId }}/events" \
                      -H "Authorization: Bearer ${PIPELINE_TOKEN}" -H "Content-Type: application/json" \
                      -d "{\"state\":\"failed\",\"runUrl\":\"$(runUrl)\",\"message\":\"deploy failed: helm upgrade\"}"
                  displayName: "Report: helm upgrade failed"
                  name: helmUpgradeFailed
                  condition: and(failed(), eq(variables['reported'], ''))
                  env:
                    PIPELINE_TOKEN: $(PIPELINE_TOKEN)

                - task: Kubernetes@1
                  displayName: kubectl logout
                  condition: always()
                  inputs:
                    connectionType: Kubernetes Service Connection
                    kubernetesServiceEndpoint: <aks-connection>
                    command: logout

                - script: |
                    set -euo pipefail
                    curl -fsS -X POST "$(INTAKE_EVENTS_URL)/v1/publish/${{ parameters.jobId }}/events" \
                      -H "Authorization: Bearer ${PIPELINE_TOKEN}" -H "Content-Type: application/json" \
                      -d "{\"state\":\"live\",\"runUrl\":\"$(runUrl)\"}"
                  displayName: Callback live
                  name: callbackLive
                  env:
                    PIPELINE_TOKEN: $(PIPELINE_TOKEN)

                - script: |
                    curl -fsS -X POST "$(INTAKE_EVENTS_URL)/v1/publish/${{ parameters.jobId }}/events" \
                      -H "Authorization: Bearer ${PIPELINE_TOKEN}" -H "Content-Type: application/json" \
                      -d "{\"state\":\"failed\",\"runUrl\":\"$(runUrl)\",\"message\":\"deploy failed: callback to intake after a successful rollout; the app may already be live, verify by hand\"}"
                  displayName: "Report: callback-live failed (rollout likely succeeded)"
                  name: callbackLiveFailed
                  condition: and(failed(), eq(variables['reported'], ''))
                  env:
                    PIPELINE_TOKEN: $(PIPELINE_TOKEN)

                - script: |
                    curl -fsS -X POST "$(INTAKE_EVENTS_URL)/v1/publish/${{ parameters.jobId }}/events" \
                      -H "Authorization: Bearer ${PIPELINE_TOKEN}" -H "Content-Type: application/json" \
                      -d "{\"state\":\"failed\",\"runUrl\":\"$(runUrl)\",\"message\":\"deploy failed: unspecified step (see run log)\"}"
                  displayName: "Report: unspecified deploy failure (catch-all)"
                  name: deployCatchAll
                  condition: and(failed(), eq(variables['reported'], ''))
                  env:
                    PIPELINE_TOKEN: $(PIPELINE_TOKEN)

  - stage: Report
    displayName: Report approval declined or timed out
    dependsOn: [Fetch, Deploy]
    condition: and(always(), eq(dependencies.Fetch.result, 'Succeeded'), eq(dependencies.Deploy.result, 'Skipped'))
    jobs:
      - job: report
        # Needed for the Timeline and Approvals REST calls below (T52); see the research comment at the top
        # of this file for the exact endpoints and the project permission this identity also needs.
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        steps:
          - checkout: none
          - script: |
              set -euo pipefail
              org="$(System.TeamFoundationCollectionUri)"
              project="$(System.TeamProject)"
              auth=(-H "Authorization: Bearer $SYSTEM_ACCESSTOKEN")

              # Walk this run's timeline: Stage "Deploy" -> child Checkpoint -> child Checkpoint.Approval.
              # docs: https://learn.microsoft.com/en-us/rest/api/azure/devops/build/timeline/get?view=azure-devops-rest-7.1
              timeline="$(curl -fsS "${auth[@]}" "${org}${project}/_apis/build/builds/$(Build.BuildId)/timeline?api-version=7.1")"
              stage_id="$(echo "$timeline" | jq -r '.records[] | select(.type=="Stage" and .name=="Deploy") | .id' | head -n1)"
              checkpoint_id="$(echo "$timeline" | jq -r --arg sid "$stage_id" '.records[] | select(.type=="Checkpoint" and .parentId==$sid) | .id' | head -n1)"
              approval_id="$(echo "$timeline" | jq -r --arg cid "$checkpoint_id" '.records[] | select(.type=="Checkpoint.Approval" and .parentId==$cid) | .id' | head -n1)"
              echo "stage=$stage_id checkpoint=$checkpoint_id approval=$approval_id"

              state="unknown"; message=""
              if [ -n "$approval_id" ] && [ "$approval_id" != "null" ]; then
                # docs: https://learn.microsoft.com/en-us/rest/api/azure/devops/approvalsandchecks/approvals/get?view=azure-devops-rest-7.1
                approval="$(curl -fsS "${auth[@]}" "${org}${project}/_apis/pipelines/approvals/${approval_id}?api-version=7.1")"
                status="$(echo "$approval" | jq -r '.status')"
                approver="$(echo "$approval" | jq -r '[.steps[]?.actualApprover.displayName, .steps[]?.assignedApprover.displayName] | map(select(. != null)) | first // "unknown approver"')"
                modified="$(echo "$approval" | jq -r '.lastModifiedOn // ""')"
                echo "approval status=$status approver=$approver modified=$modified"
                case "$status" in
                  rejected)
                    state="rejected"; message="approval declined by ${approver} at ${modified}" ;;
                  timedOut)
                    state="expired"; message="approval check timed out (no response within the window) at ${modified}" ;;
                  canceled)
                    state="rejected"; message="approval canceled at ${modified}" ;;
                  *)
                    state="rejected"
                    message="approval status '${status}' from the Approvals API did not map to rejected/expired; treating as rejected, check the Checks tab on this run" ;;
                esac
              else
                state="rejected"
                message="could not find this run's Checkpoint.Approval record via the Timeline API; falling back to the old behaviour, check the Checks tab on this run"
              fi

              curl -fsS -X POST "$(INTAKE_EVENTS_URL)/v1/publish/${{ parameters.jobId }}/events" \
                -H "Authorization: Bearer ${PIPELINE_TOKEN}" -H "Content-Type: application/json" \
                -d "$(jq -n --arg state "$state" --arg runUrl "$(runUrl)" --arg message "$message" '{state:$state, runUrl:$runUrl, message:$message}')"
            displayName: Query Approvals API, callback rejected or expired
            name: callbackRejectedOrExpired
            env:
              PIPELINE_TOKEN: $(PIPELINE_TOKEN)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
