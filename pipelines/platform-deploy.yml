# Builds the platform images, pushes them to JFrog, installs charts/artifacts-platform on the cluster (D12:
# the only path to AKS). The agents in <your-vnet-pool> are assumed to be logged in to jfrog.corp.com already
# (they build the org's other images), so no registry service connection is introduced here. python-runtime
# has its own job because it is referenced by digest and its runtime-manifest.json feeds the scanner and the
# skill reference.
#
# Image tags: pushed as jfrog.corp.com/artifacts/<name>:$(Build.BuildId) (T50). The Deploy stage passes that
# tag to Helm as `--set images.<name>=<registry>/<name>:$(tag)` for each of the four images (T71: the raw
# deploy/platform/*.yaml manifests this used to `sed` a `:<tag>` placeholder into are gone; the chart takes
# the full image reference as a value instead). See "helm upgrade --install" below and
# deploy/README.md's install-order section.
trigger:
  branches:
    include: [main]
  paths:
    include:
      - intake-api/
      - scanner/
      - static-gateway/
      - viewer-shell/
      - python-runtime/
      - deploy/
      - pipelines/platform-deploy.yml
pr: none

pool:
  name: <your-vnet-pool>

variables:
  - group: artifacts-platform
  - name: registry
    value: jfrog.corp.com/artifacts
  - name: tag
    value: $(Build.BuildId)
  # scanner/Dockerfile (T17) takes these as build args to pin and verify the gitleaks binary it downloads
  # from the JFrog generic repo (scanner/README.md SEC stage, STATUS.md T17). Not secrets; set to the real
  # pinned release once T17 documents it, same version as the Azure DevOps gitleaks policy (DESIGN D-decisions).
  - name: GITLEAKS_VERSION
    value: <gitleaks-version>
  - name: GITLEAKS_SHA256
    value: <gitleaks-sha256>

stages:
  - stage: Build
    jobs:
      - job: images
        displayName: Build and push
        strategy:
          matrix:
            intake-api:
              name: intake-api
              context: '.'          # intake-api/tsconfig.json compiles ../scanner/src too; Dockerfile expects the repo root
              buildArgs: ''
            scanner:
              name: scanner
              context: '.'          # scanner imports intake-api modules; repo-root context
              buildArgs: '--build-arg GITLEAKS_VERSION=$(GITLEAKS_VERSION) --build-arg GITLEAKS_SHA256=$(GITLEAKS_SHA256)'
            static-gateway:
              name: static-gateway
              context: 'static-gateway/'
              buildArgs: ''
            viewer-shell:
              name: viewer-shell
              context: 'viewer-shell/'
              buildArgs: ''
        steps:
          - checkout: self
          - script: |
              set -euo pipefail
              docker build --pull $(buildArgs) -f "$(name)/Dockerfile" -t "$(registry)/$(name):$(tag)" "$(context)"
              docker push "$(registry)/$(name):$(tag)"
              docker image inspect --format '{{index .RepoDigests 0}}' "$(registry)/$(name):$(tag)"
            displayName: docker build and push $(name)

      - job: runtime
        displayName: Build python-runtime, emit runtime-manifest.json
        steps:
          - checkout: self
          - script: |
              set -euo pipefail
              docker build --pull -t "$(registry)/python-runtime:$(tag)" python-runtime/
              docker push "$(registry)/python-runtime:$(tag)"
              digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$(registry)/python-runtime:$(tag)")"
              echo "python-runtime pushed as $digest"
              echo "set variable group artifacts-platform PYTHON_RUNTIME_IMAGE=$digest (deliberate, by a person)"
              mkdir -p "$(Build.ArtifactStagingDirectory)/runtime"
              docker run --rm "$(registry)/python-runtime:$(tag)" cat /runtime-manifest.json \
                > "$(Build.ArtifactStagingDirectory)/runtime/runtime-manifest.python-1.json"
              printf '%s\n' "$digest" > "$(Build.ArtifactStagingDirectory)/runtime/image-digest.txt"
            displayName: build, push, extract manifest
          - publish: $(Build.ArtifactStagingDirectory)/runtime
            artifact: python-runtime
            displayName: Publish runtime-manifest.json and digest

  - stage: Deploy
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: apply
        displayName: helm upgrade --install artifacts-platform
        environment: artifacts-platform
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                # HelmDeploy@1 over a plain script step: it resolves the AKS service connection to a
                # kubeconfig itself (no separate `az aks get-credentials` / kubectl-config step needed, the
                # way the Kubernetes@1 apply below already relies on `connectionType: Kubernetes Service
                # Connection`), and its overrideValues/valueFile inputs map directly onto `helm upgrade
                # --install --set ... -f ...` without hand-building a command line. The four images are the
                # ones pipelines/platform-deploy.yml's Build stage just pushed; python-runtime is not one of
                # them (D12: it is referenced by digest from python-runtime/test-emit-manifest.sh's
                # runtime-manifest.json, not from this chart). <platform-values-file> is a values file a
                # person maintains outside this repo (deploy/README.md "Helm install" section) -- it holds
                # tenant/subscription identifiers, never secrets (CLAUDE.md: no secrets anywhere).
                - task: HelmDeploy@1
                  displayName: helm upgrade --install artifacts-platform
                  inputs:
                    connectionType: Kubernetes Service Connection
                    kubernetesServiceEndpoint: <aks-connection>
                    namespace: artifacts-system
                    command: upgrade
                    chartType: FilePath
                    chartPath: charts/artifacts-platform
                    releaseName: artifacts-platform
                    install: true
                    valueFile: <platform-values-file>
                    overrideValues: images.intakeApi=$(registry)/intake-api:$(tag),images.scannerWorker=$(registry)/scanner:$(tag),images.staticGateway=$(registry)/static-gateway:$(tag),images.viewerShell=$(registry)/viewer-shell:$(tag)
                    arguments: --wait --timeout 5m
                - task: Kubernetes@1
                  displayName: rollout status
                  inputs:
                    connectionType: Kubernetes Service Connection
                    kubernetesServiceEndpoint: <aks-connection>
                    namespace: artifacts-system
                    command: rollout
                    arguments: status deploy/intake-api deploy/scanner-worker deploy/viewer-shell --timeout=180s
                - task: Kubernetes@1
                  displayName: rollout status (artifacts-static)
                  inputs:
                    connectionType: Kubernetes Service Connection
                    kubernetesServiceEndpoint: <aks-connection>
                    namespace: artifacts-static
                    command: rollout
                    arguments: status deploy/static-gateway --timeout=180s
